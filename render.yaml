services:
  - type: web
    name: ahmad-opspilot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: opspilot-cache
          type: keyvalue
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ahmad-opspilot.onrender.com
      - key: API_ORIGIN
        value: https://ahmad-opspilot.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: REGISTRATION_DEFAULT_ROLE
        value: engineer
      - key: INVESTIGATION_EXECUTION_MODE
        value: inline
      - key: FRONTEND_STATIC_DIR
        value: /app/frontend
      - key: PROMETHEUS_URL
        value: http://127.0.0.1:10000
      - key: TOOL_FIXTURE_ROOT
        value: /opt/opspilot/tool-fixtures
      - key: TOOL_REPOSITORY_ROOT
        value: /opt/opspilot/tool-repository

  - type: keyvalue
    name: opspilot-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: opspilot-db
    plan: free
    region: oregon
    databaseName: opspilot
    user: opspilot
    ipAllowList: []
