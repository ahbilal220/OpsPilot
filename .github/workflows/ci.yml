name: Phase 3 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opspilot -d opspilot" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://opspilot:ci-only-password@localhost:5432/opspilot
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && mypy app
      - run: pytest -q -m 'not integration'
      - run: alembic upgrade head && alembic check
      - name: Run integration tests with the deterministic metrics endpoint
        run: |
          PROMETHEUS_URL=http://127.0.0.1:8001 uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8001/api/v1/health && break
            sleep 1
          done
          PROMETHEUS_URL=http://127.0.0.1:8001 RUN_INTEGRATION=1 pytest -q -m integration
      - run: alembic downgrade base && alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build
  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose run --build --rm test
      - run: python3 scripts/smoke.py
      - run: DOCKER_CONTEXT=default python3 scripts/phase3_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
