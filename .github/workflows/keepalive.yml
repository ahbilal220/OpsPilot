name: Keep the public demo warm

on:
  schedule:
    # Offset the backup from the top of the hour, when GitHub's scheduler is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping OpsPilot health endpoint
        run: curl --fail --silent --show-error --retry 2 --max-time 90 https://ahmad-opspilot.onrender.com/api/v1/health
