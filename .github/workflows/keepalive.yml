name: Keep the public demo warm

on:
  schedule:
    # Render idles free services after 15 minutes. Fourteen minutes leaves a small buffer.
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping OpsPilot health endpoint
        run: curl --fail --silent --show-error --retry 2 --max-time 90 https://ahmad-opspilot.onrender.com/api/v1/health
